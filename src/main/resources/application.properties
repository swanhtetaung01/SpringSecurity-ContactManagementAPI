spring.application.name: spring-security-contact-management

spring.datasource.url: jdbc:h2:mem:prod-db
spring.datasource.driver-class-name: org.h2.Driver
spring.datasource.username: sa
spring.datasource.password:

spring.jpa.hibernate.ddl-auto: update

spring.h2.console.enabled: false

spring.jjackson.json-bidirectional-converter: com.fasterxml.jackson.databind.ext.Jdk8Module
spring.jjackson.default-type-element: json

spring.flyway.enabled: true
spring.flyway.baseline-on-migrate: true

spring.security.oauth2.client.registration.google.client-id: your-client-id
spring.security.oauth2.client.registration.google.client-secret: your-client-secret
spring.security.oauth2.client.registration.google.authorization-grant-type: authorization_code
spring.security.oauth2.client.registration.google.scope: email,profile,openid
spring.security.oauth2.client.registration.google.redirect-uri: http://localhost:8081/login/oauth2/code/google
spring.security.oauth2.client.provider.google.authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri: https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.jwkset-uri: https://www.googleapis.com/oauth2/v3/certs

spring.security.oauth2.resource-server.jwt.jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs

spring.web.reactive.enabled: false

logging.level.org.springframework: INFO
logging.level.org.hibernate.SQL: INFO
logging.level.org.springframework.security: INFO

management.endpoints.web.exposure.include: "*"
management.endpoint.health.show-details: "always"

spring.jersey.encoding.json.pretty-print: true
spring.jersey.json.configured-bundles: com.fasterxml.jackson.datatype.jsr310.JacksonModule

server.port: 8081
server.compression.enabled: true
server.servlet.context-path: /app

```